server:
  port: 8085
management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: spring-6-rest-mvc
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/*
            - id: spring-6-reactive
              uri:  http://localhost:8082
              predicates:
                - Path=/api/v2/*
            - id: spring-6-reactive-mongo
              uri:  http://localhost:8083
              predicates:
                - Path=/api/v3/*
            - id: auth-server
              uri: http://localhost:9000
              predicates:
                - Path=/oauth2/token*
              httpserver:
                wiretap: true
              httpclient:
                wiretap: true
logging:
  level:
    root: error
    reactor:
      netty: trace
    org:
      springframework:
        cloud:
          gateway: trace
        http:
          server:
            reactive: trace
