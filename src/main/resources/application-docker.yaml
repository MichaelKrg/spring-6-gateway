server:
  port: 8085
management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
# ENABLE BELOW FOR TROUBLESHOOTING
#      httpserver:
#        wiretap: true
#      httpclient:
#        wiretap: true
logging:
  level:
    guru:
      springframework: debug
    org:
      zalando:
        logbook: trace
      springframework:
        cloud:
          gateway: trace
        http:
          server:
            reactive: trace
    reactor:
      netty: trace
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://auth-server:9000
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: spring-6-rest-mvc
              uri: http://rest-mvc:8080
              predicates:
                - Path=/api/v1/*
            - id: spring-6-reactive
              uri:  http://reactive:8080
              predicates:
                - Path=/api/v2/*
            - id: spring-6-reactive-mongo
              uri:  http://reactive-mongo:8080
              predicates:
                - Path=/api/v3/*
            - id: spring-6-auth-server
              uri: http://auth-server:9000
              predicates:
                - Path=/oauth2/token*
